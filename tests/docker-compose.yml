services:
  collector:
    build: .
    image: busca-collector:local
    env_file:
      - .env
    environment:
      COLLECTOR_BACKEND_BASE_URL: http://backend:8080
      COLLECTOR_INTERNAL_TOKEN: dev-internal-token
      # Cache no Redis do compose
      COLLECTOR_REDIS_ENABLED: "true"
      COLLECTOR_REDIS_URL: redis://redis:6379/0
      # Storage no MinIO (S3 compatível)
      COLLECTOR_S3_ENABLED: "true"
      COLLECTOR_S3_BUCKET: collector-data
      COLLECTOR_S3_REGION: us-east-1
      COLLECTOR_S3_ENDPOINT_URL: http://minio:9000
      COLLECTOR_S3_ACCESS_KEY: minioadmin
      COLLECTOR_S3_SECRET_KEY: minioadmin
    depends_on:
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    networks:
      - buscabusca

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - buscabusca

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # Console web
    volumes:
      - minio-data:/data
    networks:
      - buscabusca

  # Cria o bucket no MinIO e encerra (one-shot). Usa a imagem `mc`, que tem o cliente.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'aguardando minio...'; sleep 2;
      done &&
      mc mb --ignore-existing local/collector-data &&
      echo 'bucket collector-data pronto'
      "
    networks:
      - buscabusca

volumes:
  minio-data:

networks:
  buscabusca:
    external: true
    name: buscabusca
