[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "busca-busca-collector"
version = "0.1.0"
description = "Coletor de imóveis (CSV oficial da Caixa) do Busca-Busca."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Consumidor de enriquecimento (RabbitMQ) — opcional: o coletor CSV não depende disso.
consumer = ["pika>=1.3"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pika>=1.3", "types-beautifulsoup4"]

[project.scripts]
collector = "collector.main:main"
collector-enriquecer = "collector.consumidores.enriquecimento:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
